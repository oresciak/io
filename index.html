<head>
  <meta charset="UTF-8" />

  <title>DRUGSTORY</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-dark: rgba(9, 6, 13, 0.82);
      --text: #f2ecff;
      --muted: rgba(242, 236, 255, 0.72);
      --accent: #f6d1ff;
      --shadow: rgba(10, 5, 18, 0.7);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #030308;
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #030308;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030308;
      padding: 24px;
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }

    .hero img {
      position: relative;
      z-index: 1;
      display: block;
      width: min(52vw, 360px);
      height: auto;
      max-width: 100%;
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.18));
      animation: glitch 0.9s infinite steps(1, end);
      transform-origin: center center;
      isolation: isolate;
      cursor: pointer;
    }

    .hero img.is-chaos {
      animation: chaos 0.12s infinite steps(1, end);
      filter: drop-shadow(0 0 32px rgba(255, 0, 60, 0.9)) contrast(1.9) saturate(2.8);
    }

    .hero img.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: none;
    }

    .hero img::before,
    .hero img::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }

    @keyframes glitch {

<body>
  <main class="hero" aria-label="drugstory opener release">
    <img id="flower" src="https://files.catbox.moe/fe502p.png" alt="kwiatuszek" tabindex="0" role="button" aria-label="kliknij, aby odtworzyć dźwięk i uruchomić efekt" />
  </main>

  <script>
    const flower = document.getElementById('flower');
    const sound = new Audio('https://files.catbox.moe/4pl3di.mp3');
    sound.preload = 'auto';
    sound.volume = 1;

    let soundPlayed = false;

    const triggerChaos = () => {
      if (!flower) return;
      flower.classList.remove('is-chaos');
      void flower.offsetWidth;
      flower.classList.add('is-chaos');
    };

    if (flower) {
      flower.addEventListener('click', () => {
        if (soundPlayed) return;
        soundPlayed = true;
        sound.currentTime = 0;
        sound.play().catch(() => {});

        setTimeout(() => {
          triggerChaos();
        }, 8000);

        setTimeout(() => {
          flower.classList.add('is-hidden');
        }, 11000);

      });

      flower.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          flower.click();
        }
      });
    }
  </script>
