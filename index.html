<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  <title>DRUGSTORY OPENER OUT NOW</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-dark: rgba(9, 6, 13, 0.82);
      --text: #f2ecff;
      --muted: rgba(242, 236, 255, 0.72);
      --accent: #f6d1ff;
      --shadow: rgba(10, 5, 18, 0.7);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #030308;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    body {
      position: relative;
      min-height: 100vh;
      background: #030308;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    .background-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.95) contrast(1.08);
      background: #000;
      z-index: 0;
    }

    .background-video::-webkit-media-controls {
      display: none !important;
    }

    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 28px 32px 40px;
      text-transform: uppercase;
    }

    .video-shell {
      position: relative;
      width: min(54vw, 720px);
      aspect-ratio: 1 / 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.18);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    .video-shell video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .video-shell video::-webkit-media-controls {
      display: none !important;
    }

    .video-shell video::-webkit-media-controls-panel {
      display: none !important;
    }

    .video-shell video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    .video-shell video::-webkit-media-controls-start-playback-button {
      display: none !important;
    }

    .video-shell .toggle {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.95);
      cursor: pointer;
      padding: 0;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, opacity 0.15s ease;
      opacity: 0.94;
    }

    .video-shell .toggle:hover,
    .video-shell .toggle:focus-visible {
      opacity: 1;
      outline: none;
    }

    .video-shell .toggle:active {
      transform: translate(-50%, -50%) scale(0.96);
    }

    .video-shell .toggle::before {
      content: "";
      display: block;
      width: 18px;
      height: 32px;
      border: none;
      margin-left: 0;
      background: linear-gradient(to right, rgba(255,255,255,0.95) 0 33%, rgba(255,255,255,0.95) 33% 66%, rgba(255,255,255,0.95) 66% 100%);
      border-radius: 2px;
    }

    .video-shell .toggle.is-playing {
      opacity: 0;
      pointer-events: none;
    }

    .video-shell .toggle.is-paused::before {
      width: 0;
      height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-left: 28px solid rgba(255, 255, 255, 0.95);
      margin-left: 8px;
      background: transparent;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="https://files.catbox.moe/5l8h2a.mp4" type="video/mp4" />
  </video>

  <main class="hero" aria-label="drugstory opener release">
    <div class="video-shell">
      <video id="releaseVideo" playsinline preload="auto">
        <source src="https://files.catbox.moe/iw6t7g.mp4" type="video/mp4" />
      </video>
      <button class="toggle" id="videoToggle" type="button" aria-label="play or pause video"></button>
    </div>
  </main>

  <script>
    const video = document.getElementById('releaseVideo');
    const toggle = document.getElementById('videoToggle');

    if (video && toggle) {
      const syncButton = () => {
        const isPaused = video.paused;
        toggle.classList.toggle('is-paused', isPaused);
        toggle.classList.toggle('is-playing', !isPaused);
        toggle.setAttribute('aria-label', isPaused ? 'pause video' : 'play video');
      };

      video.addEventListener('play', syncButton);
      video.addEventListener('pause', syncButton);
      video.addEventListener('ended', () => {
        video.pause();
        video.currentTime = 0;
        syncButton();
      });

      toggle.addEventListener('click', async () => {
        try {
          if (video.paused) {
            video.currentTime = 0;
            await video.play();
          } else {
            video.pause();
          }
        } catch (error) {
          console.warn('Video play failed:', error);
        }
      });

      video.muted = false;
      video.volume = 1;
      video.autoplay = false;
      syncButton();
    }
  </script>
</body>
</html>
