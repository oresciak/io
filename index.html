<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <title>oresciak</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
      color: #fff;
      font-family: 'VT323', monospace;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      cursor: default;
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: radial-gradient(circle at top center, rgba(130, 76, 255, 0.14), transparent 24%), radial-gradient(circle at 15% 18%, rgba(153, 80, 255, 0.10), transparent 14%), #05000d;
      color: #f5f0ff;
      font-family: 'VT323', monospace;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      cursor: default;
    }

    .countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 900px;
      padding: 0 24px;
      box-sizing: border-box;
    }

    .time {
      font-size: clamp(3rem, 10vw, 6.3rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.02;
      margin: 0;
      color: #d7c0ff;
      text-shadow: 0 0 30px rgba(160, 100, 255, 0.26);
    }

    .tracklist {
      margin: 14px auto 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
      text-align: left;
      width: clamp(320px, 90vw, 720px);
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .tracklist-item {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      color: #e9dfff;
      font-size: clamp(1.2rem, 2vw, 1.35rem);
      letter-spacing: 0.02em;
      line-height: 1.32;
      padding: 0;
      margin: 0;
    }

    .tracklist-item span,
    .tracklist-item a {
      color: inherit;
      text-decoration: none;
    }

    .tracklist-item a {
      color: #d199ff;
      font-weight: 600;
    }

    .tracklist-item a:hover,
    .tracklist-item a:focus-visible {
      color: #f2deff;
      outline: none;
    }

    .tracklist-number {
      min-width: 2.4rem;
      font-weight: 700;
      color: #b7a0d4;
      font-size: 1.15rem;
    }

    .tracklist-play {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }

    .tracklist-play:hover .track-title,
    .tracklist-play:focus-visible .track-title {
      color: #f8d2ff;
    }

    .tracklist-play .track-title {
      color: #f2e8ff;
      font-weight: 700;
    }

    .tracklist-play.playing .track-title {
      color: #c57eff;
    }

    .release-banner {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      gap: 10px;
      text-align: center;
      width: min(100%, 900px);
      padding: 0 24px;
      box-sizing: border-box;
      z-index: 1;
    }

    .release-banner .title {
      margin: 0;
      font-size: clamp(2rem, 2vw, 2rem);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: #f5e7ff;
      text-shadow: 0 0 15px rgba(173, 104, 255, 0.2);
    }

    .release-banner .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .release-banner a {
      color: #88b7ff;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      outline: none;
      box-shadow: none;
    }

    .release-banner a:hover,
    .release-banner a:focus,
    .release-banner a:focus-visible {
      color: #edddff;
      outline: none;
      box-shadow: none;
    }

    .release-banner .spotify-wrap {
      width: min(480px, 100%);
      border-radius: 16px;
      overflow: hidden;
    }

    .background-secret {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.08;
      font-size: clamp(2.5rem, 10vw, 8rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      line-height: 0.95;
      text-transform: lowercase;
      color: rgba(209, 184, 255, 0.38);
      text-align: center;
      transform: rotate(-12deg) scale(1.05);
      filter: blur(0.75px);
      user-select: none;
      -webkit-user-select: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="background-secret" aria-hidden="true">quick dose joint euphoria</div>
  <div class="release-banner">
    <p class="title">album_name</p>
    </div>
  </div>
  <div class="countdown">
    <h1 id="time" class="time">00:00:00:00</h1>
    <ol class="tracklist" aria-label="tracklista">
      <li class="tracklist-item">
        <span class="tracklist-number">1.</span>
        <button class="track-button" disabled data-src="https://example.com/track-1.mp3" aria-label="play track 1">▶</button>
        <span class="track-title">???</span>
      </li>
      <li class="tracklist-item">
        <span class="tracklist-number">2.</span>
        <button class="track-button" disabled data-src="https://example.com/track-2.mp3" aria-label="play track 2">▶</button>
        <span class="track-title">???</span>
      </li>
      <li class="tracklist-item">
        <span class="tracklist-number">3.</span>
        <button class="track-button play-toggle-3" data-src="https://files.catbox.moe/sbah8x.mp3" aria-label="play track 3">▶</button>
        <span class="track-title">???</span>
      </li>
      <li class="tracklist-item">
        <span class="tracklist-number">4.</span>
        <button class="track-button" disabled data-src="https://example.com/track-4.mp3" aria-label="play track 4">▶</button>
        <span class="track-title">???</span>
      </li>
      <li class="tracklist-item">
        <span class="tracklist-number">5.</span>
        <button class="track-button play-toggle-5" data-src="https://files.catbox.moe/t37mzm.mp3" aria-label="play track 5">▶</button>
        <span class="track-title">ROSYJSKI PRZELOT</span>
        <a class="track-link" href="https://www.youtube.com/watch?v=jsyuCPmYh9c" target="_blank" rel="noreferrer noopener">youtube</a>
        <a class="track-link" href="https://open.spotify.com/track/4mZVmiah2BBlAdIIwFKFMM?si=235ca434b3964f63" target="_blank" rel="noreferrer noopener">spotify</a>
      </li>
      <li class="tracklist-item">
        <span class="tracklist-number">6.</span>
        <button class="track-button play-toggle" data-src="https://files.catbox.moe/nlli5m.mp3" aria-label="play track 6">▶</button>
        <span class="track-title">???</span>
      </li>
      <li class="tracklist-item">
        <span class="tracklist-number">7.</span>
        <button class="track-button" disabled data-src="https://example.com/track-7.mp3" aria-label="play track 7">▶</button>
        <span class="track-title">???</span>
      </li>
    </ol>
  </div>

  <script>
    const targetDate = new Date(2026, 8, 1, 0, 0, 0);
    const timeEl = document.getElementById('time');

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        timeEl.textContent = '00:00:00:00';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      timeEl.textContent = `${String(days).padStart(2, '0')}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    const track3Button = document.querySelector('.track-button.play-toggle-3');
    const track5Button = document.querySelector('.track-button.play-toggle-5');
    const track6Button = document.querySelector('.track-button.play-toggle');
    const audio = new Audio(track6Button.dataset.src);
    audio.preload = 'auto';

    function resetPlayStates() {
      [track3Button, track5Button, track6Button].forEach(button => {
        if (button) {
          button.classList.remove('playing');
          button.textContent = '▶';
        }
      });
    }

    function setAudioSource(srcButton) {
      if (!srcButton) return;
      audio.src = srcButton.dataset.src;
    }

    function toggleSnippet(button) {
      if (!button) return;
      const isPlaying = button.classList.contains('playing');
      if (isPlaying) {
        audio.pause();
        audio.currentTime = 0;
        resetPlayStates();
        return;
      }

      setAudioSource(button);
      resetPlayStates();
      button.classList.add('playing');
      button.textContent = '❚❚';
      audio.play().catch(() => {
        resetPlayStates();
      });
    }

    audio.addEventListener('ended', function () {
      resetPlayStates();
    });

    audio.addEventListener('pause', function () {
      if (!audio.currentTime || audio.currentTime === audio.duration) {
        resetPlayStates();
      }
    });

    if (track3Button) {
      track3Button.addEventListener('click', function () {
        toggleSnippet(track3Button);
      });
      track3Button.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleSnippet(track3Button);
        }
      });
    }

    if (track5Button) {
      track5Button.addEventListener('click', function () {
        toggleSnippet(track5Button);
      });
      track5Button.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleSnippet(track5Button);
        }
      });
    }

    if (track6Button) {
      track6Button.addEventListener('click', function () {
        toggleSnippet(track6Button);
      });
      track6Button.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleSnippet(track6Button);
        }
      });
    }

    document.addEventListener('contextmenu', function (event) {
      event.preventDefault();
    });

    document.addEventListener('selectstart', function (event) {
      event.preventDefault();
    });

    document.addEventListener('dragstart', function (event) {
      event.preventDefault();
    });

    document.addEventListener('keydown', function (event) {
      const blockedKeys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Space'];
      if (blockedKeys.includes(event.key)) {
        event.preventDefault();
      }
    });

    document.addEventListener('wheel', function (event) {
      event.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', function (event) {
      event.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
